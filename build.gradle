
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    maven {
        url = 'https://maven.fabricmc.net/'
    }

    maven {
        url = 'https://maven.meteordev.org/releases'
    }

    maven {
        url = 'https://maven.meteordev.org/snapshots'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Fabric Loader
    compileOnly "net.fabricmc:fabric-loader:${loader_version}"

    // Meteor Client 26.3
    compileOnly files("libs/meteor-client-26.3-15.jar")

    // Orbit
    compileOnly files("libs/orbit-0.2.4.jar")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.named('test') {
    // src/test also holds the plain-Java CaveBurstSimulation proof harness (no JUnit).
    failOnNoDiscoveredTests = false
}

// Run with: ./gradlew caveBurstSimulation
tasks.register('caveBurstSimulation', JavaExec) {
    group = 'verification'
    description = 'Runs the cave climb/mace/totem simulation proof.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.macekill.addon.modules.macekill.CaveBurstSimulation'
}
