
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    maven {
        url = 'https://maven.fabricmc.net/'
    }

    maven {
        url = 'https://maven.meteordev.org/releases'
    }

    maven {
        url = 'https://maven.meteordev.org/snapshots'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Fabric Loader
    compileOnly "net.fabricmc:fabric-loader:${loader_version}"

    // Meteor Client 26.3 from Maven
    compileOnly "meteordevelopment:meteor-client:${minecraft_version}-SNAPSHOT"

    // Orbit
    compileOnly files("libs/orbit-0.2.4.jar")
}


processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.named('test') {
    // No JUnit tests in this addon; keep build green when src/test is empty.
    failOnNoDiscoveredTests = false
}
